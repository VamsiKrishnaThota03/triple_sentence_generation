name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: fast tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Deliberately not requirements.txt. The modules import torch,
      # transformers and bert-score lazily, so the suite runs in seconds on a
      # few small packages instead of after a multi-gigabyte download.
      - run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m unittest -v test_pipeline

      - name: The fast suite really does avoid the heavy dependencies
        run: |
          set -euo pipefail
          # If someone moves a torch import to module level, the suite above
          # would start failing in CI with a confusing ImportError. Assert the
          # absence directly so the message points at the actual cause.
          for package in torch transformers bert_score accelerate datasets; do
            if python -c "import $package" 2>/dev/null; then
              echo "::error::$package is installed; requirements-dev.txt should stay minimal"
              exit 1
            fi
          done
          python -c "import data_preprocessing, evaluation; print('modules import without torch')"

  imports:
    name: every module imports under the full requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # The fast job proves the suite needs no torch; this one proves the
      # training path still imports, which the fast job cannot tell you.
      - run: pip install -r requirements.txt

      - name: Import the training and model modules
        run: |
          set -euo pipefail
          python -c "import main, model, data_preprocessing, evaluation; print('all modules import')"

      - name: --help works without downloading a model
        run: python main.py --help
